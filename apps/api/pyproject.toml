[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend"
requires-python = ">=3.11,<3.14"
readme = "README.md"
dependencies = [
    "fastapi>=0.121.1",
    "uvicorn[standard]>=0.38.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.0.0",
    # local
    "py-finance",
    "ml-forecast",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv.sources]
# alternative local path reference
py-finance = { path = "../../packages/py-finance" }
ml-forecast = { path = "../../packages/ml-forecast" }

[dependency-groups]  # Add this section
dev = ["pytest", "black", "ruff", "pytest-asyncio", "httpx"]