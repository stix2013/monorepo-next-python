[project]
name = "ml-forecast"
version = "0.1.0"
description = "Stock price forecasting with TensorFlow"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tensorflow>=2.20.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.4.0",
    "py-finance",  # Use existing data package
]

[tool.uv.sources]
py-finance = { path = "../py-finance" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_forecast"]