[project]
name = "py-finance"
version = "0.1.0"
description = "Finance utilities using yfinance"
requires-python = ">=3.11,<3.14"
dependencies = [
    "yfinance>=0.2.32",
    "pandas>=2.1.0",
    "pydantic>=2.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_finance"]

[dependency-groups]
dev = ["pytest", "black", "ruff"]